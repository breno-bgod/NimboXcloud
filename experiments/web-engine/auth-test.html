<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NimboXcloud — diagnóstico Microsoft/Xbox</title>
<style>body{font:16px system-ui;max-width:680px;margin:2rem auto;padding:1rem;background:#101522;color:#e9edf7}button{padding:1rem;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202a3b;padding:1rem;border-radius:8px}a{color:#9bd0ff}</style>
<h1>Diagnóstico de autenticação NimboXcloud</h1>
<p>Prova de conceito Microsoft → Xbox User Token → XSTS. Nenhum token é exibido ou armazenado permanentemente. O GSSV só será testado após validar esta etapa.</p>
<button id="login">Testar Microsoft + Xbox Live/XSTS</button> <button id="clear">Limpar diagnóstico</button>
<pre id="status" role="status">Pronto para testar.</pre>
<p><a href="./">Voltar ao laboratório PSBox</a></p>
<script type="module">
const CLIENT_ID='ef556c6c-625f-460f-94f9-f0c749fa7497';
const REDIRECT='https://breno-bgod.github.io/NimboXcloud/';
const CALLBACK=REDIRECT+'auth-test.html';
const AUTH='https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize';
const TOKEN='https://login.microsoftonline.com/consumers/oauth2/v2.0/token';
const SCOPE='XboxLive.signin';
const $=id=>document.getElementById(id);
const report=s=>{$('status').textContent=s};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const random=()=>b64(crypto.getRandomValues(new Uint8Array(32)));
const sha=async s=>b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
const clean=()=>{sessionStorage.removeItem('nimbo_auth_probe');history.replaceState({},'',CALLBACK)};
$('clear').onclick=()=>{clean();report('Diagnóstico limpo.')};
$('login').onclick=async()=>{
 const verifier=random(),state=random();
 sessionStorage.setItem('nimbo_auth_probe',JSON.stringify({verifier,state,at:Date.now()}));
 const url=new URL(AUTH);
 for(const [k,v] of Object.entries({client_id:CLIENT_ID,response_type:'code',redirect_uri:CALLBACK,response_mode:'query',scope:SCOPE,state,code_challenge:await sha(verifier),code_challenge_method:'S256',prompt:'select_account'}))url.searchParams.set(k,v);
 location.assign(url.href);
};
const params=new URLSearchParams(location.search);
if(params.has('error')){
 report('Microsoft recusou o login: '+params.get('error')+'\n'+(params.get('error_description')||'').slice(0,600));
 clean();
}else if(params.has('code')){
 const saved=JSON.parse(sessionStorage.getItem('nimbo_auth_probe')||'null');
 if(!saved||saved.state!==params.get('state')||Date.now()-saved.at>600000){report('Estado OAuth inválido ou expirado. Reinicie o teste.');clean()}
 else{
  history.replaceState({},'',CALLBACK);
  report('Código OAuth recebido. Verificando troca PKCE...');
  try{
   const res=await fetch(TOKEN,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code:params.get('code'),redirect_uri:CALLBACK,code_verifier:saved.verifier,scope:SCOPE})});
   const data=await res.json();
   if(!res.ok)report('Login retornou, mas a troca de código falhou: HTTP '+res.status+' — '+(data.error||'')+' — '+(data.error_description||'').slice(0,500));
   else {
    report('Microsoft OAuth/PKCE OK. Testando Xbox User Token...');
    const xboxPost=async(url,body)=>{
      let response;
      try{response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-xbl-contract-version':'1'},body:JSON.stringify(body),cache:'no-store'})}
      catch(e){throw new Error('Bloqueio de rede/CORS no endpoint Xbox: '+new URL(url).hostname)}
      const payload=await response.json().catch(()=>({}));
      if(!response.ok||!payload.Token)throw new Error('Xbox recusou a operação em '+new URL(url).hostname+' (HTTP '+response.status+(payload.XErr?', XErr '+String(payload.XErr).replace(/[^0-9]/g,''):'')+').');
      return payload.Token;
    };
    try{
      if(!data.access_token)throw new Error('Microsoft não retornou access_token.');
      const user=await xboxPost('https://user.auth.xboxlive.com/user/authenticate',{RelyingParty:'http://auth.xboxlive.com',TokenType:'JWT',Properties:{AuthMethod:'RPS',SiteName:'user.auth.xboxlive.com',RpsTicket:'d='+data.access_token}});
      report('Microsoft OAuth/PKCE OK. Xbox User Token OK. Testando XSTS...');
      await xboxPost('https://xsts.auth.xboxlive.com/xsts/authorize',{RelyingParty:'http://gssv.xboxlive.com/',TokenType:'JWT',Properties:{SandboxId:'RETAIL',UserTokens:[user]}});
      report('Microsoft OAuth/PKCE OK. Xbox User Token OK. XSTS para GSSV emitido. Próximo passo: validar autorização no GSSV e catálogo. Nenhum token foi salvo.');
    }catch(e){report('Microsoft OAuth/PKCE OK, mas '+e.message+' Não significa que o GSSV está autorizado.')}
   }
  }catch(e){report('Troca PKCE bloqueada por rede/CORS: '+e.name)}
  finally{sessionStorage.removeItem('nimbo_auth_probe')}
 }
}
</script></html>
