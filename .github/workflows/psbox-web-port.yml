name: Experimental PSBox Web port
on:
  pull_request:
    paths:
      - 'experiments/web-engine/**'
      - '.github/workflows/psbox-web-port.yml'
  push:
    branches:
      - experiment/psbox-web-port
    paths:
      - 'experiments/web-engine/**'
      - '.github/workflows/psbox-web-port.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check experiments/web-engine/psbox-webrtc-adapter.mjs
      - run: node --test experiments/web-engine/*.test.mjs
