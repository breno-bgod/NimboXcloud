name: PSBox Web Port - GitHub Pages (experimental)
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/psbox-web-port
    paths:
      - 'experiments/web-engine/**'
      - '.github/workflows/psbox-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: psbox-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser modules
        run: |
          for file in experiments/web-engine/*.mjs; do node --check "$file"; done
          node --test experiments/web-engine/*.test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble isolated PSBox web app
        run: |
          mkdir -p _site
          cp experiments/web-engine/*.mjs _site/
          cp experiments/web-engine/cloud.html _site/index.html
          cp experiments/web-engine/player.html _site/player.html
          cp experiments/web-engine/auth-test.html _site/auth-test.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
